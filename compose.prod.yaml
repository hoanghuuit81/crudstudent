name: crudstudent

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-student_manager}
      MYSQL_USER: ${MYSQL_USER:-student_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in the server .env file}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in the server .env file}
      TZ: Asia/Bangkok
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - internal

  api:
    image: ghcr.io/${GHCR_OWNER:-hoanghuuit81}/crudstudent-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-student_manager}
      DB_USER: ${MYSQL_USER:-student_app}
      DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in the server .env file}
      CORS_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

  web:
    image: ghcr.io/${GHCR_OWNER:-hoanghuuit81}/crudstudent-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api
    networks:
      - internal

volumes:
  mysql_data:

networks:
  internal:
