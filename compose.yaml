name: crudstudent

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-student_manager}
      MYSQL_USER: ${MYSQL_USER:-student_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-student_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      TZ: Asia/Bangkok
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  api:
    build:
      context: ./api
      target: development
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-student_manager}
      DB_USER: ${MYSQL_USER:-student_app}
      DB_PASSWORD: ${MYSQL_PASSWORD:-student_password}
      CORS_ORIGIN: http://localhost:${WEB_PORT:-5173}
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "${API_PORT:-3000}:3000"
    volumes:
      - ./api:/app
      - api_node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npm run db:migrate && npm run dev"

  web:
    build:
      context: ./web
      target: development
    restart: unless-stopped
    environment:
      VITE_API_PROXY_TARGET: http://api:3000
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "${WEB_PORT:-5173}:5173"
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    depends_on:
      - api
    command: npm run dev -- --host 0.0.0.0

volumes:
  mysql_data:
  api_node_modules:
  web_node_modules:
